# Global settings
ingress:
  enabled: true
  className: "nginx"
  # Optional: You can put your specific IP here if you want to restrict it
  # host: "34.87.157.137.nip.io"

# Backend Configuration
backend:
  replicaCount: 1
  image:
    repository: "gcr.io/my-company-sit-platform/ticket-backend"
    tag: "v1"
    pullPolicy: IfNotPresent
  service:
    port: 80
  env:
    kafkaBroker: "kafka-service:9092" 

# Frontend Configuration
frontend:
  replicaCount: 1
  image:
    repository: gcr.io/my-company-sit-platform/ticket-backend
    tag: "v1"
    pullPolicy: IfNotPresent
  service:
    port: 80
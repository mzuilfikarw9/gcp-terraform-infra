apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-ingress
  annotations:
    # Rewrite target is not needed for simple root paths, but good for APIs if needed
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx  # <--- Explicitly sets the class
  rules:
    - http:
        paths:
          # 1. Backend API Traffic (Goes to Backend Service)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backend.service.name | default "ticket-backend" }}
                port:
                  number: 80
          
          # 2. Frontend Traffic (Goes to Frontend Service)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.service.name | default "ticket-frontend" }}
                port:
                  number: 80
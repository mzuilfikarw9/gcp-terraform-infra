apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
      - name: hello-world
        image: paulbouwer/hello-kubernetes:1.10
        ports:
        - containerPort: 8081  # <--- CHANGED FROM 8080
        env:
        - name: PORT           # <--- TELL APP TO USE 8081
          value: "8081"
        - name: MESSAGE
          valueFrom:
            configMapKeyRef:
              name: hello-world-config
              key: APP_MESSAGE
        resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"